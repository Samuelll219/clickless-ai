services:
  neo4j:
    image: neo4j:5.26-community
    container_name: clickless-neo4j
    ports:
      - "7474:7474"   # browser UI: http://localhost:7474
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/clickless
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
